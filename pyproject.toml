[project]
name = "safewalk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Gjorgjievski", email = "david.gj1103@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "open-clip-torch>=3.3.0",
    "openai>=3.33.0",
    "osmnx>=2.1.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
safewalk = "safewalk:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
